# GitHub Action that will automatically:
# - Build and push the controller image
# - Package the Helm chart for deploying the controller image to a K8s cluster

name: Push Controller Image and Helm Chart

on:
  push:
    branches:
    - main
    paths:
    - 'charts/**'

  pull_request_target:
    branches:
    - main
    paths:
    - 'charts/**'
    types:
    - closed

  workflow_dispatch:

jobs:
  package-charts:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      REGISTRY: ghcr.io
    permissions:
      contents: write
      packages: write
    steps:
    - name: Install Helm
      id: install-helm
      uses: azure/setup-helm@v5

    - name: Git Checkout Branch
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BRANCH_NAME }}

    - name: Extract and Set Relevant Controller Configuration from Helm Chart
      run: |
        set -ex
        echo "CONTROLLER_NAME=$(helm show chart .deploy/chart | yq -r '.name')" >> ${GITHUB_ENV}
        echo "CHART_VERSION=$(helm show chart .deploy/chart | yq -r '.version')" >> ${GITHUB_ENV}

    - name: Build Controller Image
      id: build-image
      uses: redhat-actions/buildah-build@v3
      with:
        image: ${{ env.CONTROLLER_NAME }}
        tags: ${{ env.CHART_VERSION }}
        containerfiles: ./Containerfile
        oci: true

    - name: Push to Registry
      uses: redhat-actions/push-to-registry@v3
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: ${{ env.REGISTRY }}/${{ env.GITHUB_REPOSITORY_OWNER }}
        username: ${{ env.GITHUB_ACTOR }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Package and Push Helm Chart to GitHub OCI Registry
      run: |
        set -ex
        echo ${{secrets.GITHUB_TOKEN}} | helm registry login -u ${GITHUB_ACTOR} --password-stdin ghcr.io

        cd .deploy/chart
        helm package --dependency-update .

        helm push ${CONTROLLER_NAME}-${CHART_VERSION}.tgz oci://ghcr.io/${GITHUB_REPOSITORY}