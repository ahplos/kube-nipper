apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resourcenips.nipper.ahplos.org
spec:
  group: nipper.ahplos.org
  scope: Namespaced
  names:
    plural: resourcenips
    singular: resourcenip
    kind: ResourceNip
    shortNames:
    - tps
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          data:
            type: object
            properties:
              events:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              metadata:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              onDeleteLogs:
                type: array
                items:
                  type: object
                  properties:
                    container:
                      type: string
                    timeCollected:
                      type: string
                    logs:
                      type: string
              onRestartLogs:
                type: array
                items:
                  type: object
                  properties:
                    container:
                      type: string
                    timeCollected:
                      type: string
                    logs:
                      type: string
              spec:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              status:
                type: object
                x-kubernetes-preserve-unknown-fields: true
