apiVersion: v2
name: kube-nipper
description: |-
  Deploys the kube-nipper controller, which has the ability to create snapshots of either Pods that are
  deleted or have restarted containers, or of arbitrary Kubernetes resources with defined rules of
  when snapshots should be taken.
version: 0.1.0

dependencies:
- name: gnoma
  version: 0.1.0
  repository: oci://ghcr.io/ahplos
