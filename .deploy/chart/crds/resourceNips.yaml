apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resourcenips.nipper.ahplos.org
spec:
  group: nipper.ahplos.org
  scope: Namespaced
  names:
    plural: resourcenips
    singular: resourcenip
    kind: ResourceNip
    shortNames:
    - nip
    - nips
  versions:
  - name: v1beta1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Involved ApiVersion
      type: string
      description: The apiVersion of the resource captured in this nip.
      jsonPath: .involvedObject.apiVersion
    - name: Involved Kind
      type: string
      description: The apiVersion of the resource captured in this nip.
      jsonPath: .involvedObject.kind
    - name: Source
      type: string
      description: The time the nip was captured.
      jsonPath: .source
    - name: Captured
      type: string
      description: The time the nip was captured.
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          involvedObject:
            type: object
            description: |-
              Everything in the resource that was nipped, including kind, apiVersion, metadata, spec/data, and status,
              except metadata.managedFields.
            x-kubernetes-preserve-unknown-fields: true
          involvedObjectEvents:
            type: array
            description: Any events associated with the resource being nipped.
            items:
              type: object
              x-kubernetes-preserve-unknown-fields: true
          containerLogs:
            type: array
            description: List of container logs.
            items:
              type: object
              properties:
                name:
                  type: string
                  description: Name of container.
                init:
                  type: boolean
                  description: True if the container was an init container.
                logs:
                  type: string
          source:
            type: string
            description: Rule that triggered the nip.
